<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autenticador Macroambiental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#effcf7',
                500: '#34d399',
                700: '#0f766e',
                900: '#062b1b'
              }
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="mx-auto max-w-5xl px-4 py-12 sm:px-6 lg:px-8">
      <div class="rounded-2xl border border-emerald-500/30 bg-slate-900/80 shadow-2xl shadow-emerald-900/20 ring-1 ring-white/5">
        <div class="border-b border-slate-700 px-6 py-5 sm:px-8">
          <div class="flex items-center justify-between gap-4">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.2em] text-emerald-300">Sistema</p>
              <h1 class="mt-2 text-2xl font-bold text-white sm:text-3xl">Autenticador Macroambiental</h1>
            </div>
            <span class="inline-flex items-center rounded-full bg-emerald-500/10 px-3 py-1 text-xs font-medium text-emerald-300 ring-1 ring-inset ring-emerald-500/30">
              Online
            </span>
          </div>
        </div>

        <div class="grid gap-4 p-6 sm:grid-cols-3 sm:p-8">
          <div class="rounded-xl border border-slate-700 bg-slate-800/70 p-4">
            <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Status</p>
            <p id="status-value" class="mt-4 text-2xl font-bold text-emerald-300">Carregando...</p>
          </div>
          <div class="rounded-xl border border-slate-700 bg-slate-800/70 p-4">
            <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Aplicação</p>
            <p id="app-value" class="mt-4 text-xl font-bold text-slate-100">Carregando...</p>
          </div>
          <div class="rounded-xl border border-slate-700 bg-slate-800/70 p-4">
            <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Versão</p>
            <p id="version-value" class="mt-4 text-2xl font-bold text-cyan-300">Carregando...</p>
          </div>
        </div>

        <div class="flex items-center gap-3 px-6 pb-6 sm:px-8">
          <button id="refresh-button" class="inline-flex items-center justify-center rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-950">
            Atualizar status
          </button>
          <a href="/docs" class="inline-flex items-center justify-center rounded-lg border border-slate-600 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-slate-500 hover:bg-slate-800">
            Abrir Swagger
          </a>
        </div>

        <div class="border-t border-slate-700 px-6 pb-6 pt-4 sm:px-8">
          <p class="mb-3 text-xs uppercase tracking-[0.2em] text-slate-400">Resposta da API</p>
          <pre id="details" class="overflow-x-auto rounded-xl bg-slate-950/80 p-4 text-sm text-slate-300">Carregando resposta da API...</pre>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
